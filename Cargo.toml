[package]
name = "dpl"
version = "0.0.1"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
axum = "0.8.4"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
cuid = "1.3"
flate2 = "1"
futures-util = "0.3"
minijinja = "2.12.0"
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = 3
lto = true
incremental = false
strip = true
rpath = false
debug = false
debug-assertions = false
overflow-checks = false
