[package]
name = "dpl"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
cuid = "1.3"
minijinja = "2.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
