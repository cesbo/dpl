[package]
name = "dpl"
version = "0.0.1"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
cuid = "1.3"
flate2 = "1"
fs4 = "0.13"
indicatif = "0.17"
minijinja = "2.12.0"
rand = "0.8"
scopeguard = "1"
sea-query = { version = "0.32", default-features = false, features = ["backend-postgres", "backend-mysql"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tar = "0.4"
tempfile = "3"
thiserror = "2"
percent-encoding = "2.3.2"

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = 3
lto = true
incremental = false
strip = true
rpath = false
debug = false
debug-assertions = false
overflow-checks = false
