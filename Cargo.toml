[package]
name = "dpl"
version = "0.5.3"
edition = "2024"
description = "Single-binary deploy CLI and local supervisor for web apps, databases and HTTP servers on top of podman"
license = "MIT"
repository = "https://github.com/cesbo/dpl"
homepage = "https://dpl.cesbo.com"
documentation = "https://dpl.cesbo.com"
readme = "README.md"
keywords = ["deploy", "podman", "devops", "cli", "supervisor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.15"
croner = { version = "3", features = ["serde"] }
cuid = "1.3"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
flate2 = "1"
fs4 = "0.13"
indicatif = "0.17"
minijinja = "2.12.0"
percent-encoding = "2.3.2"
rand = "0.8"
scopeguard = "1"
sea-query = { version = "0.32", default-features = false, features = ["backend-postgres", "backend-mysql"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
signal-hook = "0.4.4"
tar = "0.4"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", features = ["json"] }

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = 3
lto = true
incremental = false
strip = true
rpath = false
debug = false
debug-assertions = false
overflow-checks = false
