type: app
tokens:
  - "deploy-token-1"
  - "deploy-token-2"
domain: example.com
route: /api
image: node:20-alpine
port: 3000
build:
  layers:
    - name: deps
      files: ["package.json", "package-lock.json"]
      env:
        NODE_ENV: "production"
      script: npm ci
    - name: build
      files: ["."]
      env:
        NODE_ENV: "production"
        API_URL: "https://api.example.com"
      script: npm run build
runtime:
  env:
    NODE_ENV: "production"
    DATABASE_URL: "postgres://localhost/app"
  init: |
    npx prisma migrate deploy
  cmd: "node server.js"
volumes:
  - id: appdata
    path: /app/data
  - id: cache
    path: /app/.cache
public:
  dirs:
    - path: /app/public
      url: /static
    - path: /app/uploads
      url: /uploads
