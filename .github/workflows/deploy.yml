name: deploy-action

on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  build-binaries:
    name: 🛠️ Build Linux binary
    runs-on: ubuntu-latest

    outputs:
      release-tag: ${{ steps.create-release-tag.outputs.RELEASE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Create release tag
        id: create-release-tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          perl -0pi -e "s/^version = \".*\"/version = \"$VERSION\"/m" Cargo.toml
          echo "RELEASE_TAG=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (release, musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/dpl out/dpl
          strip -s out/dpl || true

      - name: Store built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dpl-linux-x86_64
          retention-days: 1
          path: out
          if-no-files-found: error

  build-macos-binaries:
    name: 🛠️ Build macOS binary (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact-name: dpl-macos-x86_64
          - arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact-name: dpl-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          perl -0pi -e "s/^version = \".*\"/version = \"$VERSION\"/m" Cargo.toml

      - name: Build (release, macOS)
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/dpl out/dpl
          strip out/dpl || true

      - name: Store built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          retention-days: 1
          path: out
          if-no-files-found: error

  pack-release:
    name: 🎁 Prepare release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    needs:
      - build-binaries
      - build-macos-binaries

    steps:
      - name: Get Linux binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-linux-x86_64
          path: linux-x86_64

      - name: Get macOS x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-x86_64
          path: macos-x86_64

      - name: Get macOS arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-arm64
          path: macos-arm64

      - name: Create release archive
        run: |
          chmod 755 linux-x86_64/dpl macos-x86_64/dpl macos-arm64/dpl
          tar -cvzf \
              dpl-linux-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz \
              -C linux-x86_64 \
              dpl
          tar -cvzf \
              dpl-macos-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz \
              -C macos-x86_64 \
              dpl
          tar -cvzf \
              dpl-macos-arm64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz \
              -C macos-arm64 \
              dpl

      - name: Store as artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.build-binaries.outputs.release-tag }}
          path: |
            dpl-linux-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-arm64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

      - name: Store to Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dpl-linux-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-arm64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz

  upload-to-cdn:
    name: ☁️ Upload to CDN
    runs-on: ubuntu-latest

    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build-binaries
      - build-macos-binaries
    env:
      FASTLY_REGION: eu-central
      FASTLY_PROFILE: cesbo-eu-central
      FASTLY_ENDPOINT: https://eu-central.object.fastlystorage.app

    steps:
      - name: Get Linux binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-linux-x86_64
          path: linux-x86_64

      - name: Get macOS x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-x86_64
          path: macos-x86_64

      - name: Get macOS arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-arm64
          path: macos-arm64

      - name: Compress resulting binary
        run: |
          mkdir upload
          chmod 755 linux-x86_64/dpl macos-x86_64/dpl macos-arm64/dpl
          tar -cvzf \
              upload/dpl-linux-x86_64.tar.gz \
              -C linux-x86_64 \
              dpl
          tar -cvzf \
              upload/dpl-macos-x86_64.tar.gz \
              -C macos-x86_64 \
              dpl
          tar -cvzf \
              upload/dpl-macos-arm64.tar.gz \
              -C macos-arm64 \
              dpl

      - name: Setup Fastly S3 credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-access-key-id: ${{ secrets.FASTLY_S3_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FASTLY_S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.FASTLY_REGION }}
          aws-profile: ${{ env.FASTLY_PROFILE }}

      - name: Upload to Fastly Object Storage (versioned)
        env:
          AWS_EC2_METADATA_DISABLED: true
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 sync upload "s3://cesbo/dpl/builds/${{ needs.build-binaries.outputs.release-tag }}/" \
              --endpoint-url "${FASTLY_ENDPOINT}" \
              --profile "${FASTLY_PROFILE}" \
              --no-progress \
              --only-show-errors

      - name: Upload to Fastly Object Storage (latest)
        env:
          AWS_EC2_METADATA_DISABLED: true
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 sync upload "s3://cesbo/dpl/latest/" \
              --endpoint-url "${FASTLY_ENDPOINT}" \
              --profile "${FASTLY_PROFILE}" \
              --delete \
              --no-progress \
              --only-show-errors
