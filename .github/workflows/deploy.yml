name: deploy-action

on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  build-binaries:
    name: 🛠️ Build Linux binary (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            artifact-name: dpl-linux-x86_64
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            artifact-name: dpl-linux-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Musl
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        if: ${{ matrix.arch != 'x86_64' }}
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Apply release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          perl -0pi -e "s/^version = \".*\"/version = \"$VERSION\"/m" Cargo.toml

      - name: Build (release, musl)
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/dpl out/dpl

      - name: Store built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          retention-days: 1
          path: out
          if-no-files-found: error

  build-macos-binaries:
    name: 🛠️ Build macOS binary (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact-name: dpl-macos-x86_64
          - arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact-name: dpl-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          perl -0pi -e "s/^version = \".*\"/version = \"$VERSION\"/m" Cargo.toml

      - name: Build (release, macOS)
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/dpl out/dpl
          strip out/dpl || true

      - name: Store built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          retention-days: 1
          path: out
          if-no-files-found: error

  pack-release:
    name: 🎁 Prepare release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    needs:
      - build-binaries
      - build-macos-binaries

    steps:
      - name: Get Linux x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-linux-x86_64
          path: linux-x86_64

      - name: Get Linux aarch64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-linux-aarch64
          path: linux-aarch64

      - name: Get macOS x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-x86_64
          path: macos-x86_64

      - name: Get macOS arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-arm64
          path: macos-arm64

      - name: Create release archive
        run: |
          chmod 755 linux-x86_64/dpl linux-aarch64/dpl macos-x86_64/dpl macos-arm64/dpl
          tar -cvzf \
              dpl-linux-x86_64.tar.gz \
              -C linux-x86_64 \
              dpl
          tar -cvzf \
              dpl-linux-aarch64.tar.gz \
              -C linux-aarch64 \
              dpl
          tar -cvzf \
              dpl-macos-x86_64.tar.gz \
              -C macos-x86_64 \
              dpl
          tar -cvzf \
              dpl-macos-arm64.tar.gz \
              -C macos-arm64 \
              dpl

      - name: Store to Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dpl-linux-x86_64.tar.gz
            dpl-linux-aarch64.tar.gz
            dpl-macos-x86_64.tar.gz
            dpl-macos-arm64.tar.gz
