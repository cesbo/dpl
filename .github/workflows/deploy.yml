name: deploy-action

on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  build-binaries:
    name: 🛠️ Build Linux binary
    runs-on: ubuntu-latest

    outputs:
      release-tag: ${{ steps.create-release-tag.outputs.RELEASE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Create release tag
        id: create-release-tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          perl -0pi -e "s/^version = \".*\"/version = \"$VERSION\"/m" Cargo.toml
          echo "RELEASE_TAG=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (release, musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/dpl out/dpl
          strip -s out/dpl || true

      - name: Store built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dpl-linux-x86_64
          retention-days: 1
          path: out
          if-no-files-found: error

  build-macos-binaries:
    name: 🛠️ Build macOS binary (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact-name: dpl-macos-x86_64
          - arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact-name: dpl-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          perl -0pi -e "s/^version = \".*\"/version = \"$VERSION\"/m" Cargo.toml

      - name: Build (release, macOS)
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/dpl out/dpl
          strip out/dpl || true

      - name: Store built artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          retention-days: 1
          path: out
          if-no-files-found: error

  pack-release:
    name: 🎁 Prepare release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    needs:
      - build-binaries
      - build-macos-binaries

    steps:
      - name: Get Linux binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-linux-x86_64
          path: linux-x86_64

      - name: Get macOS x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-x86_64
          path: macos-x86_64

      - name: Get macOS arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-arm64
          path: macos-arm64

      - name: Create release archive
        run: |
          GZIP=-9 tar -cvzf \
              dpl-linux-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz \
              -C linux-x86_64 \
              dpl
          GZIP=-9 tar -cvzf \
              dpl-macos-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz \
              -C macos-x86_64 \
              dpl
          GZIP=-9 tar -cvzf \
              dpl-macos-arm64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz \
              -C macos-arm64 \
              dpl

      - name: Store as artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.build-binaries.outputs.release-tag }}
          path: |
            dpl-linux-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-arm64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

      - name: Store to Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dpl-linux-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-x86_64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz
            dpl-macos-arm64-${{ needs.build-binaries.outputs.release-tag }}.tar.gz

  upload-to-cdn:
    name: ☁️ Upload to CDN
    runs-on: ubuntu-latest

    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build-binaries
      - build-macos-binaries

    steps:
      - name: Get Linux binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-linux-x86_64
          path: linux-x86_64

      - name: Get macOS x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-x86_64
          path: macos-x86_64

      - name: Get macOS arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: dpl-macos-arm64
          path: macos-arm64

      - name: Compress resulting binary
        run: |
          mkdir upload
          GZIP=-9 tar -cvzf \
              upload/dpl-linux-x86_64.tar.gz \
              -C linux-x86_64 \
              dpl
          GZIP=-9 tar -cvzf \
              upload/dpl-macos-x86_64.tar.gz \
              -C macos-x86_64 \
              dpl
          GZIP=-9 tar -cvzf \
              upload/dpl-macos-arm64.tar.gz \
              -C macos-arm64 \
              dpl

      - name: Upload to Bunny Storage (versioned)
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.5
        with:
          storagePassword: ${{ secrets.BUNNY_STORAGE_FTP_KEY }}
          storageZoneName: cesbo
          source: upload
          destination: dpl/builds/${{ needs.build-binaries.outputs.release-tag }}
          upload: "true"

      - name: Upload to Bunny Storage (latest)
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.5
        with:
          storagePassword: ${{ secrets.BUNNY_STORAGE_FTP_KEY }}
          storageZoneName: cesbo
          source: upload
          destination: dpl/latest
          remove: "true"
          upload: "true"
